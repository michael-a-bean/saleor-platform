name: Auto-Merge on Green CI

on:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName !== 'check_suite') {
              console.log('Unexpected event');
              return;
            }

            // Find PRs for this head SHA targeting platform/main
            const prs = context.payload.check_suite.pull_requests || [];
            const targetPr = prs.find(pr => pr.base.ref === 'platform/main');
            if (!targetPr) {
              console.log('No PR targeting platform/main in this check suite');
              return;
            }

            core.setOutput('number', targetPr.number);
            console.log(`PR #${targetPr.number}`);

      - name: Check auto-merge eligibility
        if: steps.pr.outputs.number
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Skip draft PRs
            if (pr.draft) {
              console.log('PR is draft, skipping');
              return;
            }

            // Check for auto-merge label
            const hasLabel = pr.labels.some(l => l.name === 'auto-merge');
            if (!hasLabel) {
              console.log('PR does not have auto-merge label, skipping');
              return;
            }

            // Check all status checks pass
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });

            const failedChecks = checks.check_runs.filter(c =>
              c.status === 'completed' && c.conclusion !== 'success' && c.conclusion !== 'skipped'
            );

            const pendingChecks = checks.check_runs.filter(c =>
              c.status !== 'completed'
            );

            if (pendingChecks.length > 0) {
              console.log(`${pendingChecks.length} checks still pending, will retry on next event`);
              return;
            }

            if (failedChecks.length > 0) {
              const names = failedChecks.map(c => c.name).join(', ');
              console.log(`Failed checks: ${names}`);
              return;
            }

            // Check for active Codex REQUEST_CHANGES (critical finding blocks merge)
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const activeBlock = reviews.find(r =>
              r.body?.startsWith('## Codex Review') &&
              r.state === 'CHANGES_REQUESTED' &&
              r.user?.login === 'github-actions[bot]'
            );

            if (activeBlock) {
              console.log('Codex has active REQUEST_CHANGES (critical finding) — not merging');
              return;
            }

            console.log('All checks pass + no active REQUEST_CHANGES — eligible for merge');
            core.setOutput('eligible', 'true');

      - name: Merge PR
        if: steps.check.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
              });
              console.log(`PR #${prNumber} merged via squash`);

              // Add merged comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '🤖 Auto-merged after all CI checks passed.',
              });
            } catch (e) {
              console.log(`Merge failed: ${e.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Auto-merge failed: ${e.message}`,
              });
            }
