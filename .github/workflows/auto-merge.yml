name: Auto-Merge on Green CI

on:
  workflow_run:
    workflows: ["test-platform"]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'pull_request') {
              // Triggered by adding a label — PR number is directly available
              const pr = context.payload.pull_request;
              if (pr.base.ref !== 'platform/main') {
                console.log(`PR targets ${pr.base.ref}, not platform/main — skipping`);
                return;
              }
              if (context.payload.label?.name !== 'auto-merge') {
                console.log(`Label "${context.payload.label?.name}" added, not auto-merge — skipping`);
                return;
              }
              core.setOutput('number', pr.number);
              console.log(`PR #${pr.number} (labeled)`);
              return;
            }

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') {
                console.log(`Workflow "${run.name}" concluded with ${run.conclusion} — skipping`);
                return;
              }

              // workflow_run provides associated PRs
              const prs = run.pull_requests || [];
              const targetPr = prs.find(pr => pr.base.ref === 'platform/main');
              if (!targetPr) {
                console.log('No PR targeting platform/main in this workflow run');
                return;
              }
              core.setOutput('number', targetPr.number);
              console.log(`PR #${targetPr.number} (workflow_run: ${run.name})`);
              return;
            }

            console.log(`Unexpected event: ${context.eventName}`);

      - name: Check auto-merge eligibility
        if: steps.pr.outputs.number
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Skip draft PRs
            if (pr.draft) {
              console.log('PR is draft, skipping');
              return;
            }

            // Check for auto-merge label
            const hasLabel = pr.labels.some(l => l.name === 'auto-merge');
            if (!hasLabel) {
              console.log('PR does not have auto-merge label, skipping');
              return;
            }

            // Only check required status checks (non-required failures should not block merge)
            const requiredChecks = [
              'Storefront Checks',
              'Apps Checks',
              'Container Builds',
              'Docker Compose Validation',
              'Migration Validation',
              'Terraform Validation',
            ];

            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });

            const requiredRuns = checks.check_runs.filter(c =>
              requiredChecks.includes(c.name)
            );

            const failedChecks = requiredRuns.filter(c =>
              c.status === 'completed' && c.conclusion !== 'success' && c.conclusion !== 'skipped'
            );

            const pendingChecks = requiredRuns.filter(c =>
              c.status !== 'completed'
            );

            if (pendingChecks.length > 0) {
              console.log(`${pendingChecks.length} required checks still pending, will retry on next event`);
              return;
            }

            if (failedChecks.length > 0) {
              const names = failedChecks.map(c => c.name).join(', ');
              console.log(`Failed required checks: ${names}`);
              return;
            }

            // Codex web review posts COMMENTED reviews (advisory only, non-blocking)
            console.log('All required checks pass — eligible for merge');
            core.setOutput('eligible', 'true');

      - name: Merge PR
        if: steps.check.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
              });
              console.log(`PR #${prNumber} merged via squash`);

              // Add merged comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '🤖 Auto-merged after all CI checks passed.',
              });
            } catch (e) {
              console.log(`Merge failed: ${e.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Auto-merge failed: ${e.message}`,
              });
            }
