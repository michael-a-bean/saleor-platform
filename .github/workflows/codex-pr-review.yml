name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Fetch base branch for diff
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Generate diff context
        id: diff
        run: |
          FILES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run Codex review
        uses: openai/codex-action@v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}"

            PR description:
            ${{ github.event.pull_request.body }}

            Files changed:
            ${{ steps.diff.outputs.files }}

            Review the changes in this PR. Focus on:
            1. Bugs or logic errors
            2. Security issues (injection, auth, data exposure)
            3. Missing error handling or edge cases
            4. Performance concerns
            5. Style/consistency issues with the surrounding codebase

            Read the changed files using the diff range:
            git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Also read CLAUDE.md for project conventions.

            Output your review as markdown with:
            - A one-line summary verdict (APPROVE / REQUEST_CHANGES / COMMENT)
            - Numbered findings with file:line references
            - Severity labels: [critical], [warning], [suggestion], [nit]
            - If no issues found, say so clearly

            Be concise. Don't praise obvious things. Focus on what matters.

      - name: Submit formal review
        if: always() && steps.codex.outputs.final-message != ''
        env:
          REVIEW_BODY: ${{ steps.codex.outputs.final-message }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = process.env.REVIEW_BODY || '';

            if (!review.trim()) {
              console.log('No review output from Codex, skipping');
              return;
            }

            // Parse verdict from first line: "APPROVE", "REQUEST_CHANGES", or "COMMENT"
            const firstLine = review.split('\n').find(l => l.trim().length > 0) || '';
            const upper = firstLine.toUpperCase();

            let event = 'COMMENT';
            if (upper.includes('APPROVE') && !upper.includes('REQUEST_CHANGES')) {
              event = 'APPROVE';
            } else if (upper.includes('REQUEST_CHANGES') || upper.includes('REQUEST CHANGES')) {
              event = 'REQUEST_CHANGES';
            }

            const body = [
              '## Codex Review',
              '',
              review,
              '',
              '---',
              `*Verdict: **${event}** | Automated review by [OpenAI Codex](https://github.com/openai/codex)*`
            ].join('\n');

            // Dismiss any previous Codex review to avoid stale blocks
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const previousCodex = reviews.filter(r =>
              r.body?.startsWith('## Codex Review') &&
              r.user?.type === 'Bot' &&
              r.state === 'CHANGES_REQUESTED'
            );

            for (const prev of previousCodex) {
              try {
                await github.rest.pulls.dismissReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  review_id: prev.id,
                  message: 'Superseded by new Codex review',
                });
                console.log(`Dismissed previous review #${prev.id}`);
              } catch (e) {
                console.log(`Could not dismiss review #${prev.id}: ${e.message}`);
              }
            }

            // Submit formal PR review
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
              event,
            });

            console.log(`Submitted ${event} review`);

            // Set output for downstream workflows
            core.setOutput('verdict', event);
