name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Fetch base branch for diff
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Generate diff context
        id: diff
        run: |
          FILES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Include actual diff content (capped at 50KB) for review context
          DIFF_CONTENT=$(git diff --submodule=diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | head -c 51200)
          echo "diff_content<<DIFFEOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_CONTENT" >> "$GITHUB_OUTPUT"
          echo "DIFFEOF" >> "$GITHUB_OUTPUT"

      - name: Run Codex review
        # Pin to v1 — update deliberately after testing new versions
        uses: openai/codex-action@v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}"

            PR description:
            ${{ github.event.pull_request.body }}

            Files changed:
            ${{ steps.diff.outputs.files }}

            Diff content (up to 50KB):
            ${{ steps.diff.outputs.diff_content }}

            Also read CLAUDE.md for project conventions if present.

            ## Severity Rubric (use EXACTLY these labels)

            - `[critical]` — Security vulnerabilities, data loss, crashes, broken auth, injection flaws.
              These BLOCK the PR. Use sparingly — only for issues that would cause real damage in production.

            - `[warning]` — Bugs, logic errors, race conditions, missing error handling that could cause failures.
              These are important but do not block the PR.

            - `[note]` — Style issues, naming suggestions, minor improvements, readability.
              Informational only.

            ## Output Format

            For each finding, output:
            - Severity label: `[critical]`, `[warning]`, or `[note]`
            - File and line reference
            - Brief description of the issue

            If no issues found, say "No issues found."

            IMPORTANT:
            - Do NOT output a verdict line (APPROVE/REQUEST_CHANGES/COMMENT). The verdict is derived automatically from your severity labels.
            - Do NOT nitpick formatting, whitespace, or style unless it causes a bug.
            - Be concise. Focus on what matters.

      - name: Submit formal review
        if: always() && steps.codex.outputs.final-message != ''
        env:
          REVIEW_BODY: ${{ steps.codex.outputs.final-message }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = process.env.REVIEW_BODY || '';

            if (!review.trim()) {
              console.log('No review output from Codex, skipping');
              return;
            }

            // Derive verdict from severity labels in the content
            // Only [critical] findings trigger REQUEST_CHANGES
            const hasCritical = /\[critical\]/i.test(review);
            const event = hasCritical ? 'REQUEST_CHANGES' : 'COMMENT';

            const body = [
              '## Codex Review',
              '',
              review,
              '',
              '---',
              `*Verdict: **${event}** | Automated review by [OpenAI Codex](https://github.com/openai/codex)*`
            ].join('\n');

            // Dismiss any previous Codex review to avoid stale blocks
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const previousCodex = reviews.filter(r =>
              r.body?.startsWith('## Codex Review') &&
              r.user?.type === 'Bot' &&
              r.state === 'CHANGES_REQUESTED'
            );

            for (const prev of previousCodex) {
              try {
                await github.rest.pulls.dismissReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  review_id: prev.id,
                  message: 'Superseded by new Codex review',
                });
                console.log(`Dismissed previous review #${prev.id}`);
              } catch (e) {
                console.log(`Could not dismiss review #${prev.id}: ${e.message}`);
              }
            }

            // Submit formal PR review
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
              event,
            });

            console.log(`Submitted ${event} review`);

            // Set output for downstream workflows
            core.setOutput('verdict', event);

      - name: Create issues for non-blocking findings
        if: always() && steps.codex.outputs.final-message != ''
        env:
          REVIEW_BODY: ${{ steps.codex.outputs.final-message }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = process.env.REVIEW_BODY || '';
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;

            // Parse [warning] and [note] findings from the review body.
            // Each finding starts with a severity tag and runs until the next
            // tag or end of text.
            const findingPattern = /\[(warning|note)\]\s*([^\[]*?)(?=\n\s*\[(?:critical|warning|note)\]|\n---|\n\s*$)/gis;
            const findings = [];

            let match;
            while ((match = findingPattern.exec(review)) !== null) {
              const severity = match[1].toLowerCase();
              const body = match[2].trim();
              if (body) {
                findings.push({ severity, body });
              }
            }

            if (findings.length === 0) {
              console.log('No warning/note findings to create issues for');
              return;
            }

            // Fetch existing open issues with the codex-review label to avoid
            // duplicates on re-runs (synchronize events).
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'codex-review',
              state: 'open',
              per_page: 100,
            });

            // Ensure labels exist
            for (const label of ['codex-review', 'warning', 'note']) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch {
                const colors = { 'codex-review': 'c5def5', 'warning': 'fbca04', 'note': 'd4c5f9' };
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: colors[label],
                  description: label === 'codex-review'
                    ? 'Automated finding from Codex PR review'
                    : `Codex ${label}-level finding`,
                });
                console.log(`Created label: ${label}`);
              }
            }

            let created = 0;
            for (const finding of findings) {
              // Extract a short title from the first line/sentence
              const firstLine = finding.body.split('\n')[0].replace(/`[^`]*`/g, '').trim();
              const titleSnippet = firstLine.length > 80
                ? firstLine.substring(0, 77) + '...'
                : firstLine;
              const title = `[${finding.severity}] PR #${prNumber}: ${titleSnippet}`;

              // Dedup: skip if an open issue with the same title already exists
              const isDuplicate = existingIssues.some(issue =>
                issue.title === title
              );

              if (isDuplicate) {
                console.log(`Skipping duplicate: ${title}`);
                continue;
              }

              const issueBody = [
                `**Source:** Codex review on PR #${prNumber} (${prTitle})`,
                `**Severity:** ${finding.severity}`,
                '',
                '### Finding',
                '',
                finding.body,
                '',
                `---`,
                `*Auto-created from [Codex PR Review](${context.payload.pull_request.html_url})*`,
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['codex-review', finding.severity],
              });

              created++;
              console.log(`Created issue: ${title}`);
            }

            console.log(`Created ${created} issues from ${findings.length} findings`);
