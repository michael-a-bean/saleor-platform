# Deploy to Staging
# Triggers on merge to platform/main or manual dispatch
# Builds ONLY changed images, runs migrations, deploys services in parallel
#
# Optimizations (2026-02-13):
# - Selective builds: skip unchanged services via path detection
# - Matrix builds: parallel image builds across separate runners
# - Parallel deploys: apps deploy alongside core (only need API, not storefront)

name: Deploy to Staging

on:
  push:
    branches: [platform/main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild all images (ignore change detection)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  AWS_REGION: us-west-1
  ENVIRONMENT: staging
  ECS_CLUSTER: saleor-platform-staging

jobs:
  # ==========================================================================
  # Detect Changes (skip unchanged services)
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      storefront: ${{ steps.filter.outputs.storefront }}
      stripe: ${{ steps.filter.outputs.stripe }}
      inventory-ops: ${{ steps.filter.outputs.inventory-ops }}
      buylist: ${{ steps.filter.outputs.buylist }}
      pos: ${{ steps.filter.outputs.pos }}
      mtg-import: ${{ steps.filter.outputs.mtg-import }}
      any_app: ${{ steps.filter.outputs.stripe == 'true' || steps.filter.outputs.inventory-ops == 'true' || steps.filter.outputs.buylist == 'true' || steps.filter.outputs.pos == 'true' || steps.filter.outputs.mtg-import == 'true' }}
      any_changed: ${{ steps.check.outputs.any_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0  # Needed for change detection

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            storefront:
              - 'storefront/**'
            stripe:
              - 'saleor-apps'
              - 'saleor-apps/apps/stripe/**'
              - 'saleor-apps/packages/**'
            inventory-ops:
              - 'saleor-apps'
              - 'saleor-apps/apps/inventory-ops/**'
              - 'saleor-apps/packages/**'
            buylist:
              - 'saleor-apps'
              - 'saleor-apps/apps/buylist/**'
              - 'saleor-apps/packages/**'
            pos:
              - 'saleor-apps'
              - 'saleor-apps/apps/pos/**'
              - 'saleor-apps/packages/**'
            mtg-import:
              - 'saleor-apps'
              - 'saleor-apps/apps/mtg-import/**'
              - 'saleor-apps/packages/**'

      - name: Check if any service changed
        id: check
        run: |
          if [[ "${{ inputs.force_all }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.storefront }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.stripe }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.inventory-ops }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.buylist }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.pos }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.mtg-import }}" == "true" ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "::notice::No service files changed. Skipping build and deploy."
          fi

  # ==========================================================================
  # Validate Environment
  # ==========================================================================
  validate:
    name: Validate Environment
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Validate environment configuration
        run: |
          SALEOR_ENVIRONMENT=staging ./scripts/validate-environment.sh pre-deploy || {
            echo "::error::Environment validation failed. Check for localhost URLs or other issues."
            exit 1
          }
        env:
          SKIP_DB_CHECKS: "true"

      - name: Set variables
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Build and Push Images (parallel matrix — only changed services)
  # ==========================================================================
  build:
    name: Build ${{ matrix.service }}
    needs: [changes, validate]
    if: needs.changes.outputs.any_changed == 'true' || inputs.force_all == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: storefront
            image_name: saleor-platform/storefront
            context: ./storefront
            dockerfile: ./storefront/Dockerfile
            change_key: storefront
            build_args_extra: |
              NEXT_PUBLIC_BUILD_ENV=staging
              NEXT_PUBLIC_SALEOR_API_URL=${{ vars.STAGING_API_URL }}/graphql/
              NEXT_PUBLIC_STOREFRONT_URL=${{ vars.STAGING_STOREFRONT_URL }}
              NEXT_PUBLIC_DEFAULT_CHANNEL=webstore
          - service: stripe-app
            image_name: saleor-platform/stripe-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/stripe/Dockerfile
            change_key: stripe
            build_args_extra: |
              BASE_PATH=/apps/stripe
          - service: inventory-ops-app
            image_name: saleor-platform/inventory-ops-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/inventory-ops/Dockerfile
            change_key: inventory-ops
            build_args_extra: |
              BASE_PATH=/apps/inventory
          - service: buylist-app
            image_name: saleor-platform/buylist-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/buylist/Dockerfile
            change_key: buylist
            build_args_extra: |
              BASE_PATH=/apps/buylist
          - service: pos-app
            image_name: saleor-platform/pos-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/pos/Dockerfile
            change_key: pos
            build_args_extra: |
              BASE_PATH=/apps/pos
          - service: mtg-import-app
            image_name: saleor-platform/mtg-import-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/mtg-import/Dockerfile
            change_key: mtg-import
            build_args_extra: |
              BASE_PATH=/apps/mtg-import
      fail-fast: false

    outputs:
      sha_short: ${{ needs.validate.outputs.sha_short }}

    steps:
      - name: Check if service changed
        id: should-build
        run: |
          CHANGED="${{ needs.changes.outputs[matrix.change_key] }}"
          FORCE="${{ inputs.force_all }}"
          if [[ "$CHANGED" == "true" ]] || [[ "$FORCE" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Building ${{ matrix.service }} (changed=$CHANGED, force=$FORCE)"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping ${{ matrix.service }} — no changes detected"
          fi

      - name: Checkout
        if: steps.should-build.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure AWS credentials
        if: steps.should-build.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.should-build.outputs.build == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args_extra }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name }}:${{ needs.validate.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name }}:staging-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL }}

  # ==========================================================================
  # Run Migrations
  # ==========================================================================
  migrate:
    name: Run Migrations
    needs: [validate, build]
    if: always() && needs.validate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # STAGING SNAPSHOT POLICY:
      # Staging snapshots are BEST-EFFORT and NON-BLOCKING.
      # The snapshot will complete in the background during deployment.
      - name: Create pre-migration RDS snapshot (async, best-effort)
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SNAPSHOT_ID="saleor-platform-staging-pre-migrate-${TIMESTAMP}"
          echo "Creating snapshot: ${SNAPSHOT_ID}"
          aws rds create-db-snapshot \
            --db-instance-identifier saleor-platform-staging-saleor \
            --db-snapshot-identifier "${SNAPSHOT_ID}" || true
          echo "Snapshot creation initiated (async - not waiting for completion)"

      - name: Run Django migrations
        run: |
          ./scripts/deploy/aws/run-migrations.sh staging django
        env:
          SHA: ${{ needs.validate.outputs.sha_short }}
          ECS_TASK_SUBNETS: ${{ vars.STAGING_ECS_TASK_SUBNETS }}
          ECS_TASK_SECURITY_GROUPS: ${{ vars.STAGING_ECS_TASK_SECURITY_GROUPS }}

      - name: Run Prisma migrations (inventory-ops)
        run: |
          ./scripts/deploy/aws/run-migrations.sh staging prisma inventory-ops
        env:
          SHA: ${{ needs.validate.outputs.sha_short }}
          ECS_TASK_SUBNETS: ${{ vars.STAGING_ECS_TASK_SUBNETS }}
          ECS_TASK_SECURITY_GROUPS: ${{ vars.STAGING_ECS_TASK_SECURITY_GROUPS }}

      # NOTE: mtg-import Prisma migrations are INTENTIONALLY OMITTED.
      # mtg-import shares inventory-ops's database and schema (symlink).
      # Running migrations from both apps causes conflicts:
      #   - mtg-import's 0001_initial tries to CREATE tables inventory-ops already made
      #   - Failed record poisons _prisma_migrations, blocking inventory-ops on next run
      # Only inventory-ops should run Prisma migrations for the shared schema.

  # ==========================================================================
  # Deploy Core Services (api, worker, storefront, dashboard)
  # ==========================================================================
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [validate, build, migrate]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      matrix:
        service: [api, worker, storefront, dashboard]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ matrix.service }}
        run: |
          ./scripts/deploy/aws/deploy-service.sh staging ${{ matrix.service }} ${{ needs.validate.outputs.sha_short }}

      - name: Wait for service stability
        if: matrix.service != 'dashboard'  # Skip if dashboard is scaled to 0
        run: |
          echo "Waiting for ${{ matrix.service }} to reach steady state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}
          echo "Service ${{ matrix.service }} is stable"

  # ==========================================================================
  # Deploy Apps (runs in PARALLEL with core — only needs migrations done)
  # Apps depend on API being available, not on storefront/dashboard.
  # ==========================================================================
  deploy-apps:
    name: Deploy ${{ matrix.app }}
    needs: [validate, build, migrate]
    if: always() && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      matrix:
        include:
          - app: stripe
            service: stripe
          - app: inventory-ops
            service: inventory-ops
          - app: buylist
            service: buylist
          - app: pos
            service: pos
          - app: mtg-import
            service: mtg-import
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if service exists
        id: check-service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")
          echo "status=${SERVICE_STATUS}" >> $GITHUB_OUTPUT
          if [[ "$SERVICE_STATUS" != "ACTIVE" ]]; then
            echo "::warning::Service '${{ matrix.service }}' does not exist or is not active. Skipping deployment."
          fi

      - name: Deploy ${{ matrix.app }}
        if: steps.check-service.outputs.status == 'ACTIVE'
        run: |
          ./scripts/deploy/aws/deploy-service.sh staging ${{ matrix.service }} ${{ needs.validate.outputs.sha_short }}

      - name: Wait for service stability
        if: steps.check-service.outputs.status == 'ACTIVE'
        run: |
          echo "Waiting for ${{ matrix.service }} to reach steady state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}
          echo "Service ${{ matrix.service }} is stable"

  # ==========================================================================
  # URL Validation (post-deploy)
  # ==========================================================================
  validate-urls:
    name: Validate URLs
    needs: [deploy, deploy-apps]
    if: always() && (needs.deploy.result == 'success' || needs.deploy-apps.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configured URLs are reachable
        run: |
          ./scripts/deploy/aws/validate-urls.sh staging
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL }}

  # ==========================================================================
  # Smoke Tests
  # ==========================================================================
  smoke-test:
    name: Smoke Tests
    needs: [validate, validate-urls]
    if: always() && needs.validate-urls.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run core smoke tests
        run: |
          ./scripts/deploy/aws/smoke-test.sh staging
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL }}
          STAGING_DASHBOARD_URL: ${{ vars.STAGING_DASHBOARD_URL }}

      - name: Run apps smoke tests
        run: |
          ./scripts/smoke/apps-smoke.sh ${{ vars.STAGING_APPS_URL }}

      - name: Report deployment success
        if: success()
        run: |
          echo "## Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.validate.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ vars.STAGING_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Storefront**: ${{ vars.STAGING_STOREFRONT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard**: ${{ vars.STAGING_DASHBOARD_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apps Verified" >> $GITHUB_STEP_SUMMARY
          echo "- Stripe: ${{ vars.STAGING_APPS_URL }}/apps/stripe" >> $GITHUB_STEP_SUMMARY
          echo "- Inventory: ${{ vars.STAGING_APPS_URL }}/apps/inventory" >> $GITHUB_STEP_SUMMARY
          echo "- Buylist: ${{ vars.STAGING_APPS_URL }}/apps/buylist" >> $GITHUB_STEP_SUMMARY
          echo "- POS: ${{ vars.STAGING_APPS_URL }}/apps/pos" >> $GITHUB_STEP_SUMMARY
          echo "- MTG Import: ${{ vars.STAGING_APPS_URL }}/apps/mtg-import" >> $GITHUB_STEP_SUMMARY
