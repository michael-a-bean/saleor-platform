# Deploy to Staging
# Triggers on merge to platform/main or manual dispatch
# Builds ONLY changed images, runs migrations, deploys services in parallel
#
# Optimizations (2026-02-13):
# - Selective builds: skip unchanged services via path detection
# - Matrix builds: parallel image builds across separate runners
# - Parallel deploys: apps deploy alongside core (only need API, not storefront)
#
# Optimizations (2026-03-10):
# - Selective deploys: skip deploy for unchanged services (not just builds)
# - Selective migrations: skip when no Prisma schema/migration files changed
# - Core services (api/worker/dashboard) only redeploy when migrations ran or force_all

name: Deploy to Staging

on:
  push:
    branches: [platform/main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild all images (ignore change detection)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  AWS_REGION: us-west-1
  ENVIRONMENT: staging
  ECS_CLUSTER: saleor-platform-staging

jobs:
  # ==========================================================================
  # Detect Changes (skip unchanged services)
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      storefront: ${{ steps.filter.outputs.storefront }}
      stripe: ${{ steps.merge.outputs.stripe }}
      inventory-ops: ${{ steps.merge.outputs.inventory-ops }}
      buylist: ${{ steps.merge.outputs.buylist }}
      pos: ${{ steps.merge.outputs.pos }}
      mtg-import: ${{ steps.merge.outputs.mtg-import }}
      migrations: ${{ steps.merge.outputs.migrations }}
      any_app: ${{ steps.merge.outputs.stripe == 'true' || steps.merge.outputs.inventory-ops == 'true' || steps.merge.outputs.buylist == 'true' || steps.merge.outputs.pos == 'true' || steps.merge.outputs.mtg-import == 'true' }}
      any_changed: ${{ steps.check.outputs.any_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Nested submodules: pos, inventory-ops, buylist inside saleor-apps
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 2  # Only need HEAD~1 for change detection

      # Shallow clone (fetch-depth: 2) doesn't give the submodule enough
      # history for `git diff --submodule=diff` to compute file-level diffs.
      # Unshallow just the submodule so the diff step can see actual changes.
      - name: Ensure submodule history for diff
        run: git -C saleor-apps fetch --unshallow 2>/dev/null || true

      - name: Detect changed paths (non-submodule)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            storefront:
              - 'storefront/**'
            stripe:
              - 'saleor-apps/apps/stripe/**'
              - 'saleor-apps/packages/**'
            inventory-ops:
              - 'saleor-apps/apps/inventory-ops/**'
              - 'saleor-apps/packages/**'
            buylist:
              - 'saleor-apps/apps/buylist/**'
              - 'saleor-apps/packages/**'
            pos:
              - 'saleor-apps/apps/pos/**'
              - 'saleor-apps/packages/**'
            mtg-import:
              - 'saleor-apps/apps/mtg-import/**'
              - 'saleor-apps/packages/**'
            migrations:
              - 'saleor-apps/apps/inventory-ops/prisma/**'
              - 'saleor-apps/apps/mtg-import/prisma/**'

      # dorny/paths-filter can't see inside submodule content changes —
      # it only sees the pointer diff. This step inspects the actual files
      # that changed inside saleor-apps between the old and new pointer.
      - name: Detect submodule content changes
        id: submodule
        run: |
          # Get the submodule diff between this commit and its parent
          DIFF=$(git diff --submodule=diff HEAD~1 HEAD -- saleor-apps 2>/dev/null || echo "")

          if [[ -z "$DIFF" ]]; then
            echo "No submodule changes detected"
            echo "stripe=false" >> $GITHUB_OUTPUT
            echo "inventory-ops=false" >> $GITHUB_OUTPUT
            echo "buylist=false" >> $GITHUB_OUTPUT
            echo "pos=false" >> $GITHUB_OUTPUT
            echo "mtg-import=false" >> $GITHUB_OUTPUT
            echo "packages=false" >> $GITHUB_OUTPUT
            echo "migrations=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Submodule diff detected, checking which apps changed..."

          # Extract changed file paths from the submodule diff
          # Lines look like: "diff --git a/saleor-apps/apps/mtg-import/... b/saleor-apps/apps/mtg-import/..."
          # The saleor-apps/ prefix (submodule mount point) must be stripped so
          # check_app can match against bare paths like "apps/mtg-import/".
          CHANGED_FILES=$(echo "$DIFF" | grep '^diff --git' | sed 's|diff --git a/||; s| b/.*||; s|^saleor-apps/||')
          echo "Changed files in submodule:"
          echo "$CHANGED_FILES"

          # Check each app directory for changes
          check_app() {
            local app_dir="$1"
            if echo "$CHANGED_FILES" | grep -q "^${app_dir}/"; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "stripe=$(check_app apps/stripe)" >> $GITHUB_OUTPUT
          echo "inventory-ops=$(check_app apps/inventory-ops)" >> $GITHUB_OUTPUT
          echo "buylist=$(check_app apps/buylist)" >> $GITHUB_OUTPUT
          echo "pos=$(check_app apps/pos)" >> $GITHUB_OUTPUT
          echo "mtg-import=$(check_app apps/mtg-import)" >> $GITHUB_OUTPUT
          echo "packages=$(check_app packages)" >> $GITHUB_OUTPUT

          # Migration-specific detection (Prisma schema/migration files)
          INVOPS_PRISMA=$(check_app apps/inventory-ops/prisma)
          MTGIMP_PRISMA=$(check_app apps/mtg-import/prisma)
          if [[ "$INVOPS_PRISMA" == "true" ]] || [[ "$MTGIMP_PRISMA" == "true" ]]; then
            echo "migrations=true" >> $GITHUB_OUTPUT
          else
            echo "migrations=false" >> $GITHUB_OUTPUT
          fi

      # Merge: an app needs rebuild if EITHER dorny detected changes
      # OR the submodule content inspection found changes in that app.
      # Shared packages changes trigger all apps (same as before).
      - name: Merge change detection results
        id: merge
        run: |
          merge() {
            local app="$1"
            local dorny="${2}"
            local sub="${3}"
            local sub_packages="${4}"
            if [[ "$dorny" == "true" ]] || [[ "$sub" == "true" ]] || [[ "$sub_packages" == "true" ]]; then
              echo "true"
            else
              echo "false"
            fi
          }

          SUB_PKG="${{ steps.submodule.outputs.packages }}"

          STRIPE=$(merge stripe "${{ steps.filter.outputs.stripe }}" "${{ steps.submodule.outputs.stripe }}" "$SUB_PKG")
          INVOPS=$(merge inventory-ops "${{ steps.filter.outputs.inventory-ops }}" "${{ steps.submodule.outputs.inventory-ops }}" "$SUB_PKG")
          BUYLIST=$(merge buylist "${{ steps.filter.outputs.buylist }}" "${{ steps.submodule.outputs.buylist }}" "$SUB_PKG")
          POS=$(merge pos "${{ steps.filter.outputs.pos }}" "${{ steps.submodule.outputs.pos }}" "$SUB_PKG")
          MTGIMP=$(merge mtg-import "${{ steps.filter.outputs.mtg-import }}" "${{ steps.submodule.outputs.mtg-import }}" "$SUB_PKG")

          # Migrations: dorny OR submodule detection
          DORNY_MIG="${{ steps.filter.outputs.migrations }}"
          SUB_MIG="${{ steps.submodule.outputs.migrations }}"
          if [[ "$DORNY_MIG" == "true" ]] || [[ "$SUB_MIG" == "true" ]]; then
            MIGRATIONS="true"
          else
            MIGRATIONS="false"
          fi

          echo "stripe=$STRIPE" >> $GITHUB_OUTPUT
          echo "inventory-ops=$INVOPS" >> $GITHUB_OUTPUT
          echo "buylist=$BUYLIST" >> $GITHUB_OUTPUT
          echo "pos=$POS" >> $GITHUB_OUTPUT
          echo "mtg-import=$MTGIMP" >> $GITHUB_OUTPUT
          echo "migrations=$MIGRATIONS" >> $GITHUB_OUTPUT

          echo "## Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | dorny | submodule | merged |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| stripe | ${{ steps.filter.outputs.stripe }} | ${{ steps.submodule.outputs.stripe }} | $STRIPE |" >> $GITHUB_STEP_SUMMARY
          echo "| inventory-ops | ${{ steps.filter.outputs.inventory-ops }} | ${{ steps.submodule.outputs.inventory-ops }} | $INVOPS |" >> $GITHUB_STEP_SUMMARY
          echo "| buylist | ${{ steps.filter.outputs.buylist }} | ${{ steps.submodule.outputs.buylist }} | $BUYLIST |" >> $GITHUB_STEP_SUMMARY
          echo "| pos | ${{ steps.filter.outputs.pos }} | ${{ steps.submodule.outputs.pos }} | $POS |" >> $GITHUB_STEP_SUMMARY
          echo "| mtg-import | ${{ steps.filter.outputs.mtg-import }} | ${{ steps.submodule.outputs.mtg-import }} | $MTGIMP |" >> $GITHUB_STEP_SUMMARY
          echo "| migrations | $DORNY_MIG | $SUB_MIG | $MIGRATIONS |" >> $GITHUB_STEP_SUMMARY

      - name: Check if any service changed
        id: check
        run: |
          if [[ "${{ inputs.force_all }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.storefront }}" == "true" ]] || \
             [[ "${{ steps.merge.outputs.stripe }}" == "true" ]] || \
             [[ "${{ steps.merge.outputs.inventory-ops }}" == "true" ]] || \
             [[ "${{ steps.merge.outputs.buylist }}" == "true" ]] || \
             [[ "${{ steps.merge.outputs.pos }}" == "true" ]] || \
             [[ "${{ steps.merge.outputs.mtg-import }}" == "true" ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "::notice::No service files changed. Skipping build and deploy."
          fi

  # ==========================================================================
  # Validate Environment
  # ==========================================================================
  validate:
    name: Validate Environment
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          SALEOR_ENVIRONMENT=staging ./scripts/validate-environment.sh pre-deploy || {
            echo "::error::Environment validation failed. Check for localhost URLs or other issues."
            exit 1
          }
        env:
          SKIP_DB_CHECKS: "true"

      - name: Set variables
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Build and Push Images (parallel matrix — only changed services)
  # ==========================================================================
  build:
    name: Build ${{ matrix.service }}
    needs: [changes, validate]
    if: needs.changes.outputs.any_changed == 'true' || inputs.force_all == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: storefront
            image_name: saleor-platform/storefront
            context: ./storefront
            dockerfile: ./storefront/Dockerfile
            change_key: storefront
            build_args_extra: |
              NEXT_PUBLIC_BUILD_ENV=staging
              NEXT_PUBLIC_SALEOR_API_URL=${{ vars.STAGING_API_URL }}/graphql/
              NEXT_PUBLIC_STOREFRONT_URL=${{ vars.STAGING_STOREFRONT_URL }}
              NEXT_PUBLIC_DEFAULT_CHANNEL=webstore
          - service: stripe-app
            image_name: saleor-platform/stripe-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/stripe/Dockerfile
            change_key: stripe
            build_args_extra: |
              BASE_PATH=/apps/stripe
          - service: inventory-ops-app
            image_name: saleor-platform/inventory-ops-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/inventory-ops/Dockerfile
            change_key: inventory-ops
            build_args_extra: |
              BASE_PATH=/apps/inventory
          - service: buylist-app
            image_name: saleor-platform/buylist-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/buylist/Dockerfile
            change_key: buylist
            build_args_extra: |
              BASE_PATH=/apps/buylist
          - service: pos-app
            image_name: saleor-platform/pos-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/pos/Dockerfile
            change_key: pos
            build_args_extra: |
              BASE_PATH=/apps/pos
          - service: mtg-import-app
            image_name: saleor-platform/mtg-import-app
            context: ./saleor-apps
            dockerfile: ./saleor-apps/apps/mtg-import/Dockerfile
            change_key: mtg-import
            build_args_extra: |
              BASE_PATH=/apps/mtg-import
      fail-fast: false

    outputs:
      sha_short: ${{ needs.validate.outputs.sha_short }}

    steps:
      - name: Check if service changed
        id: should-build
        run: |
          CHANGED="${{ needs.changes.outputs[matrix.change_key] }}"
          FORCE="${{ inputs.force_all }}"
          if [[ "$CHANGED" == "true" ]] || [[ "$FORCE" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Building ${{ matrix.service }} (changed=$CHANGED, force=$FORCE)"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping ${{ matrix.service }} — no changes detected"
          fi

      - name: Checkout
        if: steps.should-build.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Nested submodules: pos, inventory-ops, buylist inside saleor-apps
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Configure AWS credentials
        if: steps.should-build.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.should-build.outputs.build == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: ${{ matrix.build_args_extra }}
          tags: ${{ matrix.image_name }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL }}

      - name: Check for trivyignore
        if: steps.should-build.outputs.build == 'true'
        id: trivyignore
        run: |
          # Look for .trivyignore relative to the Dockerfile context
          DOCKERFILE_DIR=$(dirname "${{ matrix.dockerfile }}")
          if [ -f "${DOCKERFILE_DIR}/.trivyignore" ]; then
            echo "file=${DOCKERFILE_DIR}/.trivyignore" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy image scan ${{ matrix.service }}
        if: steps.should-build.outputs.build == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image_name }}:scan
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ steps.trivyignore.outputs.file }}

      - name: Tag and push ${{ matrix.service }}
        if: steps.should-build.outputs.build == 'true'
        run: |
          docker tag ${{ matrix.image_name }}:scan ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name }}:${{ needs.validate.outputs.sha_short }}
          docker tag ${{ matrix.image_name }}:scan ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name }}:staging-latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name }}:${{ needs.validate.outputs.sha_short }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image_name }}:staging-latest

  # ==========================================================================
  # Run Migrations
  # ==========================================================================
  migrate:
    name: Run Migrations
    needs: [changes, validate, build]
    if: >-
      always()
      && needs.validate.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.changes.outputs.migrations == 'true' || inputs.force_all == 'true')
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # STAGING SNAPSHOT POLICY:
      # Staging snapshots are BEST-EFFORT and NON-BLOCKING.
      # The snapshot will complete in the background during deployment.
      - name: Create pre-migration RDS snapshot (async, best-effort)
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SNAPSHOT_ID="saleor-platform-staging-pre-migrate-${TIMESTAMP}"
          echo "Creating snapshot: ${SNAPSHOT_ID}"
          aws rds create-db-snapshot \
            --db-instance-identifier saleor-platform-staging-saleor \
            --db-snapshot-identifier "${SNAPSHOT_ID}" || true
          echo "Snapshot creation initiated (async - not waiting for completion)"

      - name: Run all migrations (Django + Prisma)
        id: migrations
        run: |
          MIGRATION_STATUS=""
          FAILED=false

          echo "::group::Django migrations"
          if ./scripts/deploy/aws/run-migrations.sh staging django; then
            echo "✅ Django migrations succeeded"
            MIGRATION_STATUS="django:success"
          else
            echo "❌ Django migrations FAILED"
            MIGRATION_STATUS="django:FAILED"
            FAILED=true
          fi
          echo "::endgroup::"

          if [[ "$FAILED" == "true" ]]; then
            echo "::error::Django migrations failed — skipping Prisma migrations"
            echo "::warning::PARTIAL MIGRATION STATE: ${MIGRATION_STATUS}"
            echo "::warning::The database may have partial Django schema changes applied."
            echo "::warning::Review the migration output above and consider restoring from the pre-migration RDS snapshot."
            exit 1
          fi

          echo "::group::Prisma migrations (inventory-ops)"
          if ./scripts/deploy/aws/run-migrations.sh staging prisma inventory-ops; then
            echo "✅ Prisma inventory-ops migrations succeeded"
            MIGRATION_STATUS="${MIGRATION_STATUS},prisma-inventory-ops:success"
          else
            echo "❌ Prisma inventory-ops migrations FAILED"
            MIGRATION_STATUS="${MIGRATION_STATUS},prisma-inventory-ops:FAILED"
            FAILED=true
          fi
          echo "::endgroup::"

          if [[ "$FAILED" == "true" ]]; then
            echo "::error::Prisma inventory-ops migrations failed — skipping remaining migrations"
            echo "::warning::PARTIAL MIGRATION STATE: ${MIGRATION_STATUS}"
            echo "::warning::Django migrations succeeded but Prisma failed. Old app images are still running against the new Django schema."
            echo "::warning::This is usually safe, but destructive Django migrations (column renames, drops) may cause issues."
            exit 1
          fi

          echo "::group::Prisma migrations (mtg-import)"
          if ./scripts/deploy/aws/run-migrations.sh staging prisma mtg-import; then
            echo "✅ Prisma mtg-import migrations succeeded"
            MIGRATION_STATUS="${MIGRATION_STATUS},prisma-mtg-import:success"
          else
            echo "❌ Prisma mtg-import migrations FAILED"
            MIGRATION_STATUS="${MIGRATION_STATUS},prisma-mtg-import:FAILED"
            FAILED=true
          fi
          echo "::endgroup::"

          if [[ "$FAILED" == "true" ]]; then
            echo "::error::Prisma mtg-import migrations failed"
            echo "::warning::PARTIAL MIGRATION STATE: ${MIGRATION_STATUS}"
            echo "::warning::Django + inventory-ops Prisma succeeded, but mtg-import Prisma failed."
            exit 1
          fi

          echo "✅ All migrations succeeded: ${MIGRATION_STATUS}"
        env:
          SHA: ${{ needs.validate.outputs.sha_short }}
          ECS_TASK_SUBNETS: ${{ vars.STAGING_ECS_TASK_SUBNETS }}
          ECS_TASK_SECURITY_GROUPS: ${{ vars.STAGING_ECS_TASK_SECURITY_GROUPS }}

  # ==========================================================================
  # Deploy Core Services (api, worker, storefront, dashboard)
  # ==========================================================================
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [changes, validate, build, migrate]
    if: always() && needs.validate.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      matrix:
        service: [api, worker, storefront, dashboard]
      fail-fast: false

    steps:
      # Core services use KEEP images (no new code). Only deploy when:
      # - api/worker: migrations ran (need restart for new schema) or force_all
      # - storefront: image was rebuilt or force_all
      # - dashboard: force_all only (scaled to 0)
      - name: Check if deploy needed
        id: should-deploy
        run: |
          SERVICE="${{ matrix.service }}"
          FORCE="${{ inputs.force_all }}"
          MIGRATIONS="${{ needs.changes.outputs.migrations }}"
          STOREFRONT="${{ needs.changes.outputs.storefront }}"
          MIGRATE_RAN="${{ needs.migrate.result }}"

          DEPLOY=false
          case "$SERVICE" in
            api|worker)
              [[ "$MIGRATE_RAN" == "success" || "$FORCE" == "true" ]] && DEPLOY=true ;;
            storefront)
              [[ "$STOREFRONT" == "true" || "$FORCE" == "true" ]] && DEPLOY=true ;;
            dashboard)
              [[ "$FORCE" == "true" ]] && DEPLOY=true ;;
          esac

          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          if [[ "$DEPLOY" == "false" ]]; then
            echo "::notice::Skipping $SERVICE deploy — no relevant changes"
          else
            echo "Deploying $SERVICE (force=$FORCE, migrations=$MIGRATIONS, storefront=$STOREFRONT)"
          fi

      - name: Checkout
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ matrix.service }}
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          ./scripts/deploy/aws/deploy-service.sh staging ${{ matrix.service }} ${{ needs.validate.outputs.sha_short }}

      - name: Wait for service stability
        if: steps.should-deploy.outputs.deploy == 'true' && matrix.service != 'dashboard'
        run: |
          echo "Waiting for ${{ matrix.service }} to reach steady state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}
          echo "Service ${{ matrix.service }} is stable"

  # ==========================================================================
  # Deploy Apps (runs in PARALLEL with core — only needs migrations done)
  # Apps depend on API being available, not on storefront/dashboard.
  # ==========================================================================
  deploy-apps:
    name: Deploy ${{ matrix.app }}
    needs: [changes, validate, build, migrate]
    if: always() && needs.validate.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      matrix:
        include:
          - app: stripe
            service: stripe
          - app: inventory-ops
            service: inventory-ops
          - app: buylist
            service: buylist
          - app: pos
            service: pos
          - app: mtg-import
            service: mtg-import
      fail-fast: false

    steps:
      - name: Check if deploy needed
        id: should-deploy
        run: |
          CHANGED="${{ needs.changes.outputs[matrix.app] }}"
          FORCE="${{ inputs.force_all }}"
          if [[ "$CHANGED" == "true" ]] || [[ "$FORCE" == "true" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "Deploying ${{ matrix.app }} (changed=$CHANGED, force=$FORCE)"
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping ${{ matrix.app }} deploy — no changes detected"
          fi

      - name: Checkout
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if service exists
        if: steps.should-deploy.outputs.deploy == 'true'
        id: check-service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")
          echo "status=${SERVICE_STATUS}" >> $GITHUB_OUTPUT
          if [[ "$SERVICE_STATUS" != "ACTIVE" ]]; then
            echo "::warning::Service '${{ matrix.service }}' does not exist or is not active. Skipping deployment."
          fi

      - name: Deploy ${{ matrix.app }}
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-service.outputs.status == 'ACTIVE'
        run: |
          ./scripts/deploy/aws/deploy-service.sh staging ${{ matrix.service }} ${{ needs.validate.outputs.sha_short }}

      - name: Wait for service stability
        if: steps.should-deploy.outputs.deploy == 'true' && steps.check-service.outputs.status == 'ACTIVE'
        run: |
          echo "Waiting for ${{ matrix.service }} to reach steady state..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}
          echo "Service ${{ matrix.service }} is stable"

  # ==========================================================================
  # URL Validation (post-deploy)
  # ==========================================================================
  validate-urls:
    name: Validate URLs
    needs: [changes, deploy, deploy-apps]
    if: >-
      always()
      && (needs.deploy.result == 'success' || needs.deploy-apps.result == 'success')
      && (needs.changes.outputs.any_changed == 'true' || inputs.force_all == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configured URLs are reachable
        run: |
          ./scripts/deploy/aws/validate-urls.sh staging
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL }}

  # ==========================================================================
  # Smoke Tests
  # ==========================================================================
  smoke-test:
    name: Smoke Tests
    needs: [changes, validate, validate-urls]
    if: >-
      always()
      && needs.validate-urls.result == 'success'
      && (needs.changes.outputs.any_changed == 'true' || inputs.force_all == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run core smoke tests
        run: |
          ./scripts/deploy/aws/smoke-test.sh staging
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_STOREFRONT_URL: ${{ vars.STAGING_STOREFRONT_URL }}
          STAGING_DASHBOARD_URL: ${{ vars.STAGING_DASHBOARD_URL }}

      - name: Run apps smoke tests
        run: |
          ./scripts/smoke/apps-smoke.sh ${{ vars.STAGING_APPS_URL }}

      - name: Report deployment success
        if: success()
        run: |
          echo "## Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.validate.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ vars.STAGING_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Storefront**: ${{ vars.STAGING_STOREFRONT_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard**: ${{ vars.STAGING_DASHBOARD_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apps Verified" >> $GITHUB_STEP_SUMMARY
          echo "- Stripe: ${{ vars.STAGING_APPS_URL }}/apps/stripe" >> $GITHUB_STEP_SUMMARY
          echo "- Inventory: ${{ vars.STAGING_APPS_URL }}/apps/inventory" >> $GITHUB_STEP_SUMMARY
          echo "- Buylist: ${{ vars.STAGING_APPS_URL }}/apps/buylist" >> $GITHUB_STEP_SUMMARY
          echo "- POS: ${{ vars.STAGING_APPS_URL }}/apps/pos" >> $GITHUB_STEP_SUMMARY
          echo "- MTG Import: ${{ vars.STAGING_APPS_URL }}/apps/mtg-import" >> $GITHUB_STEP_SUMMARY
