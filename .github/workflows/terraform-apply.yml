# Terraform Apply on Merge
# Auto-applies Terraform changes when infra files are merged to platform/main
# Runs plan first, then apply. Creates GitHub issue on failure.

name: Terraform Apply

on:
  push:
    paths:
      - 'infra/terraform/**'
    branches:
      - platform/main

env:
  AWS_REGION: us-west-1
  TF_VAR_FILE: environments/staging.tfvars
  TERRAFORM_VERSION: "1.5"
  TF_VAR_grafana_api_token: ${{ secrets.GRAFANA_API_TOKEN }}

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="key=staging/terraform.tfstate"

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: |
          set +e
          terraform plan -detailed-exitcode -var-file=${{ env.TF_VAR_FILE }} -no-color -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No changes detected — nothing to apply."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "Changes detected — will apply."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Plan failed."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Post success summary
        if: success() && steps.plan.outputs.has_changes == 'true'
        run: |
          echo "## Terraform Apply Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure changes applied successfully." >> $GITHUB_STEP_SUMMARY

      - name: Post no-changes summary
        if: success() && steps.plan.outputs.has_changes == 'false'
        run: |
          echo "## Terraform Apply — No Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No infrastructure changes detected. Nothing applied." >> $GITHUB_STEP_SUMMARY

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planOutput = 'Plan output not available';
            try {
              planOutput = fs.readFileSync('infra/terraform/plan-output.txt', 'utf8');
              if (planOutput.length > 5000) {
                planOutput = planOutput.substring(0, 5000) + '\n\n... (truncated)';
              }
            } catch (e) {}

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform Apply Failed — ${new Date().toISOString().split('T')[0]}`,
              body: `## Terraform Apply Failure

            **Commit:** ${context.sha}
            **Actor:** ${context.actor}
            **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            <details>
            <summary>Plan Output</summary>

            \`\`\`
            ${planOutput}
            \`\`\`

            </details>

            ### Action Required

            1. Review the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for error details
            2. Fix the issue and push a new commit, OR
            3. Run \`terraform apply\` manually from \`infra/terraform/\`

            ---
            *Generated by terraform-apply workflow*`,
              labels: ['terraform-drift', 'infrastructure']
            });
