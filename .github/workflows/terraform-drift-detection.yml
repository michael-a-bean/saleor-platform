# Terraform Drift Detection
# Runs weekly to detect infrastructure drift between Terraform state and AWS reality
# Created: 2026-01-27 per Council recommendations

name: Terraform Drift Detection

on:
  schedule:
    # Every Monday at 9 AM UTC (1 AM PST)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      alert_on_drift:
        description: 'Post alert if drift detected'
        required: false
        default: 'true'
        type: boolean

env:
  AWS_REGION: us-west-1
  TF_VAR_FILE: environments/staging.tfvars
  TERRAFORM_VERSION: "1.5"

jobs:
  drift-detection:
    name: Detect Terraform Drift
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        id: init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform Plan (Drift Detection)
        id: plan
        working-directory: infra/terraform
        run: |
          set +e
          terraform plan -detailed-exitcode -var-file=${{ env.TF_VAR_FILE }} -no-color -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Exit codes: 0 = no changes, 1 = error, 2 = changes detected (drift)
          if [ $EXIT_CODE -eq 0 ]; then
            echo "drift_status=✅ No drift detected" >> $GITHUB_OUTPUT
            echo "has_drift=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "drift_status=⚠️ DRIFT DETECTED" >> $GITHUB_OUTPUT
            echo "has_drift=true" >> $GITHUB_OUTPUT
          else
            echo "drift_status=❌ Plan failed" >> $GITHUB_OUTPUT
            echo "has_drift=error" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Generate Drift Summary
        id: summary
        working-directory: infra/terraform
        run: |
          # Extract resource changes from plan output
          ADDS=$(grep -c "will be created" plan-output.txt 2>/dev/null || echo "0")
          CHANGES=$(grep -c "will be updated" plan-output.txt 2>/dev/null || echo "0")
          DESTROYS=$(grep -c "will be destroyed" plan-output.txt 2>/dev/null || echo "0")

          echo "adds=$ADDS" >> $GITHUB_OUTPUT
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          echo "destroys=$DESTROYS" >> $GITHUB_OUTPUT

          # Create summary for issue/PR
          cat << EOF > drift-summary.md
          ## Terraform Drift Detection Report

          **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          **Status:** ${{ steps.plan.outputs.drift_status }}

          ### Resource Changes Detected

          | Action | Count |
          |--------|-------|
          | ➕ Create | $ADDS |
          | 🔄 Update | $CHANGES |
          | ❌ Destroy | $DESTROYS |

          ### Expected Drift (from docs/reference/expected-divergence.md)

          The following drift is **expected** and should be ignored:
          - ECS task definitions (CI/CD deploys new revisions)
          - Any resources marked in expected-divergence.md

          ### Action Required

          If drift is unexpected:
          1. Review the full plan output in the workflow logs
          2. Determine if changes were made manually
          3. Either:
             - Import resources to align state, OR
             - Apply Terraform to reset to desired state
          4. Update \`docs/ops/incident-changes.md\` if this was from incident response

          ---
          *Generated by terraform-drift-detection workflow*
          EOF

          cat drift-summary.md

      - name: Create Issue on Drift
        if: steps.plan.outputs.has_drift == 'true' && (github.event_name == 'schedule' || inputs.alert_on_drift == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('infra/terraform/drift-summary.md', 'utf8');

            // Check for existing open drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'terraform-drift'
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: summary
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Terraform Drift Detected - ' + new Date().toISOString().split('T')[0],
                body: summary,
                labels: ['terraform-drift', 'infrastructure']
              });
            }

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: |
            infra/terraform/plan-output.txt
            infra/terraform/drift-summary.md
          retention-days: 30

      - name: Summary
        run: |
          echo "## Drift Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.plan.outputs.drift_status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Resources to create | ${{ steps.summary.outputs.adds }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resources to update | ${{ steps.summary.outputs.changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resources to destroy | ${{ steps.summary.outputs.destroys }} |" >> $GITHUB_STEP_SUMMARY
