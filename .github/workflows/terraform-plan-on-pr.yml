# Terraform Plan on PR
# Runs terraform plan when infrastructure files change in a PR
# Posts plan output as a PR comment for review

name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
    branches:
      - platform/main

env:
  AWS_REGION: us-west-1
  TF_VAR_FILE: environments/staging.tfvars
  TERRAFORM_VERSION: "1.5"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="key=staging/terraform.tfstate"

      - name: Terraform Format Check
        id: fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        working-directory: infra/terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: |
          terraform plan -var-file=${{ env.TF_VAR_FILE }} -no-color -out=tfplan 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan-output.txt', 'utf8');

            const fmtOutcome = '${{ steps.fmt.outcome }}';
            const validateOutcome = '${{ steps.validate.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';

            // Truncate plan if too long for GitHub comment (max ~65k chars)
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;

            const body = `## Terraform Plan Results

            | Check | Status |
            |-------|--------|
            | Format | ${fmtOutcome === 'success' ? '✅' : '❌'} |
            | Validate | ${validateOutcome === 'success' ? '✅' : '❌'} |
            | Plan | ${planOutcome === 'success' ? '✅' : '❌'} |

            <details>
            <summary>Plan Output</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            ---
            *Generated by terraform-plan-on-pr workflow*`;

            // Find existing bot comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(c =>
              c.body.includes('Terraform Plan Results') &&
              c.body.includes('terraform-plan-on-pr workflow')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail on Issues
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
