# Terraform Plan on PR
# Runs terraform plan when infrastructure files change in a PR
# Includes: fmt, validate, tflint, trivy, plan, terraform-docs

name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
    branches:
      - platform/main

env:
  AWS_REGION: us-west-1
  TF_VAR_FILE: environments/staging.tfvars
  TERRAFORM_VERSION: "1.5"
  TF_VAR_grafana_api_token: ${{ secrets.GRAFANA_API_TOKEN }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/saleor-platform-staging-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -backend-config="key=staging/terraform.tfstate"

      - name: Terraform Format Check
        id: fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        working-directory: infra/terraform
        run: terraform validate -no-color
        continue-on-error: true

      # --- tflint ---
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint plugins
        working-directory: infra/terraform
        run: tflint --init

      - name: Run tflint
        id: tflint
        working-directory: infra/terraform
        run: tflint --format compact --recursive
        continue-on-error: true

      # --- trivy IaC scan ---
      - name: Run Trivy IaC scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          trivyignores: infra/terraform/.trivyignore
          exit-code: 1
          severity: HIGH,CRITICAL
        continue-on-error: true

      # --- Terraform Plan ---
      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: |
          terraform plan -var-file=${{ env.TF_VAR_FILE }} -no-color -out=tfplan 2>&1 | tee plan-output.txt
        continue-on-error: true

      # --- terraform-docs ---
      - name: Check terraform-docs freshness
        id: tfdocs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: infra/terraform/modules
          config-file: infra/terraform/.terraform-docs.yml
          output-file: README.md
          output-method: inject
          fail-on-diff: true
          recursive: true
          recursive-path: .
        continue-on-error: true

      # --- Post results to PR ---
      - name: Post Plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let plan = 'Plan output not available (plan step did not run)';
            try {
              plan = fs.readFileSync('infra/terraform/plan-output.txt', 'utf8');
            } catch (e) {}

            const fmtOutcome = '${{ steps.fmt.outcome }}';
            const validateOutcome = '${{ steps.validate.outcome }}';
            const tflintOutcome = '${{ steps.tflint.outcome }}';
            const trivyOutcome = '${{ steps.trivy.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';
            const tfdocsOutcome = '${{ steps.tfdocs.outcome }}';

            const maxLen = 50000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;

            const icon = (outcome) => outcome === 'success' ? '✅' : '❌';
            const docsNote = tfdocsOutcome === 'failure' ? ' (run `terraform-docs` locally)' : '';

            const body = `## Terraform Plan Results

            | Check | Status |
            |-------|--------|
            | Format | ${icon(fmtOutcome)} |
            | Validate | ${icon(validateOutcome)} |
            | tflint | ${icon(tflintOutcome)} |
            | Trivy | ${icon(trivyOutcome)} |
            | Plan | ${icon(planOutcome)} |
            | Docs | ${icon(tfdocsOutcome)}${docsNote} |

            <details>
            <summary>Plan Output</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            ---
            *Generated by terraform-plan-on-pr workflow*`;

            // Find existing bot comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(c =>
              c.body.includes('Terraform Plan Results') &&
              c.body.includes('terraform-plan-on-pr workflow')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail on Issues
        if: |
          steps.fmt.outcome == 'failure' ||
          steps.validate.outcome == 'failure' ||
          steps.tflint.outcome == 'failure' ||
          steps.trivy.outcome == 'failure' ||
          steps.plan.outcome == 'failure'
        run: exit 1
