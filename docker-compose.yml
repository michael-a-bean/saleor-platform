services:
  api:
    image: ghcr.io/saleor/saleor:3.22
    ports:
      - 8000:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    stdin_open: true
    tty: true
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - db
      - cache
      - jaeger
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
      # mount docs for data files
      - ./docs:/app/data:ro
    env_file:
      - common.env
      - backend.env
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db/saleor
      - DASHBOARD_URL=http://localhost:9000/
      - ALLOWED_HOSTS=localhost,127.0.0.1,api,stripe-app,inventory-ops-app,buylist-app,pos-app,mtg-import-app,host.docker.internal
      - HTTP_IP_FILTER_ENABLED=False
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY:-}

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.22
    ports:
      - 9000:80
    restart: unless-stopped

  db:
    image: library/postgres:15-alpine
    ports:
      - 5432:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro,z
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  cache:
    image: valkey/valkey:8.1-alpine
    ports:
      - 6379:6379
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-cache:/data

  worker:
    image: ghcr.io/saleor/saleor:3.22
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - common.env
      - backend.env
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db/saleor
      - HTTP_IP_FILTER_ENABLED=False
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY:-}
    depends_on:
      - cache
      - mailpit
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media

  jaeger:
    image: jaegertracing/jaeger:2.14.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui. Visit http://localhost:8025/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

  storefront:
    build:
      context: ./storefront
      network: host
      args:
        - NEXT_PUBLIC_SALEOR_API_URL=http://localhost:8000/graphql/
        - NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000
        - NEXT_PUBLIC_DEFAULT_CHANNEL=webstore
    image: saleor-storefront:local
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - api
      - meilisearch
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_SALEOR_API_URL=http://localhost:8000/graphql/
      # SALEOR_API_URL uses Docker internal hostname to match JWT issuer (iss claim)
      # The JWT is issued with iss=http://api:8000/graphql/ so server-side requests must use same URL
      - SALEOR_API_URL=http://api:8000/graphql/
      - NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000
      - NEXT_PUBLIC_DEFAULT_CHANNEL=webstore
      - MEILISEARCH_URL=http://meilisearch:7700

  # Stripe Payment App
  stripe-app:
    build:
      context: ./saleor-apps
      dockerfile: apps/stripe/Dockerfile
    ports:
      - 3001:3001
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - dynamodb-local
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - SECRET_KEY=${STRIPE_APP_SECRET_KEY:?STRIPE_APP_SECRET_KEY is required}
      - ALLOWED_DOMAIN_PATTERN=/.*/
      - APP_IFRAME_BASE_URL=http://localhost:3001
      - APP_API_BASE_URL=http://host.docker.internal:3001
      - APP_LOG_LEVEL=debug
      - APL=dynamodb
      - AWS_REGION=localhost
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
      - DYNAMODB_MAIN_TABLE_NAME=stripe-main-table

  # Local DynamoDB for Stripe app storage
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - 8001:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier

  # Inventory Ops App
  inventory-ops-app:
    build:
      context: ./saleor-apps
      dockerfile: apps/inventory-ops/Dockerfile
    ports:
      - 3002:3002
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - inventory-ops-db
    volumes:
      - inventory-ops-apl:/app/apps/inventory-ops/data
    environment:
      - SECRET_KEY=${INVENTORY_OPS_SECRET_KEY:?INVENTORY_OPS_SECRET_KEY is required}
      - DATABASE_URL=${INVENTORY_DATABASE_URL:?INVENTORY_DATABASE_URL is required}
      - ALLOWED_DOMAIN_PATTERN=/.*/
      - APP_IFRAME_BASE_URL=http://localhost:3002
      - APP_API_BASE_URL=http://inventory-ops-app:3002
      - APP_LOG_LEVEL=debug
      - DEFAULT_CURRENCY=USD
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_INDEX_PREFIX=

  # PostgreSQL database for Inventory Ops App
  inventory-ops-db:
    image: postgres:15-alpine
    ports:
      - 5433:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - inventory-ops-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${INVENTORY_POSTGRES_USER:?INVENTORY_POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
      - POSTGRES_DB=inventory_ops

  # Saleor MCP Server for AI assistant integration
  saleor-mcp:
    build:
      context: ./saleor-mcp
    ports:
      - 6000:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - api
    environment:
      - ALLOWED_DOMAIN_PATTERN=.*
      - LOGLEVEL=INFO

  # Buylist App - shares inventory-ops database
  buylist-app:
    build:
      context: ./saleor-apps
      dockerfile: apps/buylist/Dockerfile
    ports:
      - 3003:3003
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - inventory-ops-db
    volumes:
      - buylist-apl:/app/apps/buylist/data
    environment:
      - SECRET_KEY=${BUYLIST_SECRET_KEY:?BUYLIST_SECRET_KEY is required}
      - DATABASE_URL=${INVENTORY_DATABASE_URL:?INVENTORY_DATABASE_URL is required}
      - ALLOWED_DOMAIN_PATTERN=/.*/
      - APP_IFRAME_BASE_URL=http://localhost:3003
      - APP_API_BASE_URL=http://buylist-app:3003
      - APP_LOG_LEVEL=debug
      - DEFAULT_CURRENCY=USD
      - DEFAULT_CHANNEL_SLUG=webstore
      - SCRYFALL_API_BASE_URL=https://api.scryfall.com
      - SCRYFALL_RATE_LIMIT_MS=100

  # POS App - Point of Sale for in-store transactions
  pos-app:
    build:
      context: ./saleor-apps
      dockerfile: apps/pos/Dockerfile
    ports:
      - 3004:3004
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - inventory-ops-db
    volumes:
      - pos-apl:/app/apps/pos/data
    environment:
      - SECRET_KEY=${POS_SECRET_KEY:?POS_SECRET_KEY is required}
      - DATABASE_URL=${INVENTORY_DATABASE_URL:?INVENTORY_DATABASE_URL is required}
      - ALLOWED_DOMAIN_PATTERN=/.*/
      - APP_IFRAME_BASE_URL=http://localhost:3004
      - APP_API_BASE_URL=http://pos-app:3004
      - APP_LOG_LEVEL=debug
      - DEFAULT_CURRENCY=USD
      - DEFAULT_TAX_RATE=0.1025
      # Stripe Terminal settings (Phase 2)
      # - STRIPE_SECRET_KEY=sk_test_...
      # - STRIPE_TERMINAL_LOCATION_ID=tml_...

  # MTG Import App - bulk card import from Scryfall
  mtg-import-app:
    build:
      context: ./saleor-apps
      dockerfile: apps/mtg-import/Dockerfile
    ports:
      - 3005:3005
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - inventory-ops-db
    volumes:
      - mtg-import-apl:/app/apps/mtg-import/data
    environment:
      - SECRET_KEY=${MTG_IMPORT_SECRET_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2}
      - DATABASE_URL=${INVENTORY_DATABASE_URL:?INVENTORY_DATABASE_URL is required}
      - ALLOWED_DOMAIN_PATTERN=/.*/
      - APP_IFRAME_BASE_URL=http://localhost:3005
      - APP_API_BASE_URL=http://mtg-import-app:3005
      - APP_LOG_LEVEL=debug
      - DEFAULT_CURRENCY=USD
      - SCRYFALL_API_BASE_URL=https://api.scryfall.com
      - SCRYFALL_RATE_LIMIT_MS=100
      - SCRYFALL_CONTACT_EMAIL=${SCRYFALL_CONTACT_EMAIL:-dev@localhost.local}

  # Meilisearch - fast search engine for singles-builder
  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - 7700:7700
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - meilisearch-data:/meili_data
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
      # ============================================
      # PRODUCTION CONFIGURATION
      # ============================================
      # For production deployments, set:
      # - MEILI_ENV=production
      # - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      #
      # Generate key: openssl rand -base64 32
      # Store in .env: MEILISEARCH_MASTER_KEY=<generated-key>
      # ============================================

  # Price Sync CLI - for manual sync commands
  price-sync:
    build:
      context: ./saleor-apps
      dockerfile: apps/price-sync/Dockerfile
    networks:
      - saleor-backend-tier
    depends_on:
      - db
      - inventory-ops-db
    environment:
      - DATABASE_URL=${INVENTORY_DATABASE_URL:?INVENTORY_DATABASE_URL is required}
      - SALEOR_DATABASE_URL=${SALEOR_DATABASE_URL:?SALEOR_DATABASE_URL is required}
      - INSTALLATION_ID=${INSTALLATION_ID:-}
      - SALEOR_CHANNEL_ID=${SALEOR_CHANNEL_ID:-webstore}
      - SCRYFALL_RATE_LIMIT_MS=${SCRYFALL_RATE_LIMIT_MS:-100}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    profiles:
      - tools

  # Price Sync Worker Daemon - processes jobs from dashboard queue
  price-sync-worker:
    build:
      context: ./saleor-apps
      dockerfile: apps/price-sync/Dockerfile
    command: ["node", "dist/index.mjs", "process", "--daemon"]
    networks:
      - saleor-backend-tier
    depends_on:
      - db
      - inventory-ops-db
    environment:
      - DATABASE_URL=${INVENTORY_DATABASE_URL:?INVENTORY_DATABASE_URL is required}
      - SALEOR_DATABASE_URL=${SALEOR_DATABASE_URL:?SALEOR_DATABASE_URL is required}
      - INSTALLATION_ID=${INSTALLATION_ID:-}
      - SALEOR_CHANNEL_ID=${SALEOR_CHANNEL_ID:-webstore}
      - SCRYFALL_RATE_LIMIT_MS=${SCRYFALL_RATE_LIMIT_MS:-100}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    profiles:
      - workers

volumes:
  saleor-db:
    driver: local
  saleor-cache:
    driver: local
  saleor-media:
  stripe-app-data:
    driver: local
  inventory-ops-db:
    driver: local
  inventory-ops-apl:
    driver: local
  buylist-apl:
    driver: local
  pos-apl:
    driver: local
  mtg-import-apl:
    driver: local
  meilisearch-data:
    driver: local

networks:
  saleor-backend-tier:
    driver: bridge
