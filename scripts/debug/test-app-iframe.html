<!DOCTYPE html>
<html>
<head>
    <title>App Iframe Test</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #container { margin: 20px 0; }
        iframe { border: 2px solid #ccc; width: 100%; height: 600px; }
        .logs { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>App Iframe Test</h1>
    <p>This page simulates how the Saleor Dashboard embeds apps in iframes.</p>

    <div>
        <label>App URL (appUrl from manifest):</label>
        <input type="text" id="appUrl" style="width: 80%;" value="http://saleor-platform-staging-alb-540548859.us-west-1.elb.amazonaws.com/apps/stripe">
    </div>
    <div style="margin-top: 10px;">
        <label>Saleor API URL:</label>
        <input type="text" id="saleorApiUrl" style="width: 80%;" value="http://saleor-platform-staging-alb-540548859.us-west-1.elb.amazonaws.com/graphql/">
    </div>

    <div style="margin-top: 10px;">
        <button onclick="loadApp()">Load App in Iframe</button>
        <button onclick="sendHandshake()">Send Handshake Event</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>

    <h3>Iframe:</h3>
    <div id="container">
        <iframe id="appFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <h3>PostMessage Events:</h3>
    <div id="eventLogs" class="logs">Waiting for events...</div>

    <script>
        const eventLogs = document.getElementById('eventLogs');
        const appFrame = document.getElementById('appFrame');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            eventLogs.textContent += `\n[${time}] ${msg}`;
            eventLogs.scrollTop = eventLogs.scrollHeight;
            console.log(msg);
        }

        function clearLogs() {
            eventLogs.textContent = 'Cleared.';
        }

        // Listen for messages FROM the app
        window.addEventListener('message', (event) => {
            log(`Received from app (${event.origin}): ${JSON.stringify(event.data, null, 2)}`);

            // If app sends notifyReady, respond with handshake
            if (event.data && event.data.type === 'notifyReady') {
                log('App sent notifyReady! Auto-responding with handshake...');
                setTimeout(() => sendHandshake(), 500);
            }
        });

        function loadApp() {
            const appUrl = document.getElementById('appUrl').value;
            const saleorApiUrl = document.getElementById('saleorApiUrl').value;

            // Construct the full iframe URL with query params (as Dashboard does)
            const url = new URL(appUrl);
            url.searchParams.set('saleorApiUrl', saleorApiUrl);
            url.searchParams.set('id', 'saleor.app.payment.stripe');
            url.searchParams.set('theme', 'light');
            url.searchParams.set('locale', 'en');

            const iframeUrl = url.toString();
            log(`Loading iframe: ${iframeUrl}`);

            appFrame.src = iframeUrl;
            log('Iframe src set. Waiting for app to load and send notifyReady...');
        }

        function sendHandshake() {
            // Create a mock token (this won't actually work for auth, but tests the mechanism)
            const mockToken = 'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3MzczNDQwMDAsImV4cCI6MTczNzk0ODgwMCwiZW1haWwiOiJ0ZXN0QGV4YW1wbGUuY29tIiwidXNlclBlcm1pc3Npb25zIjpbXSwiYXBwIjoic2FsZW9yLmFwcC5wYXltZW50LnN0cmlwZSIsImlzcyI6InNhbGVvciIsInR5cGUiOiJhcHAifQ.mock';

            const handshakeEvent = {
                type: 'handshake',
                payload: {
                    token: mockToken,
                    version: 1,
                    saleorVersion: '3.21.0',
                    dashboardVersion: '3.21.18'
                }
            };

            log(`Sending handshake to app: ${JSON.stringify(handshakeEvent)}`);
            appFrame.contentWindow.postMessage(handshakeEvent, '*');
        }

        log('Test page ready. Click "Load App in Iframe" to start.');
    </script>
</body>
</html>
