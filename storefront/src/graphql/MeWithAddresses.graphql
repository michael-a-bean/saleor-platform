query MeWithAddresses {
	me {
		...UserDetails
		addresses {
			id
			firstName
			lastName
			companyName
			streetAddress1
			streetAddress2
			city
			cityArea
			postalCode
			countryArea
			country {
				country
				code
			}
			phone
		}
		defaultShippingAddress {
			id
		}
		defaultBillingAddress {
			id
		}
	}
}
