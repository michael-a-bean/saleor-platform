fragment ProductListItem on Product {
	id
	name
	slug
	pricing {
		priceRange {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
	}
	category {
		id
		name
	}
	thumbnail(size: 512, format: WEBP) {
		url
		alt
	}
	media {
		url
		alt
	}
	variants {
		quantityAvailable
	}
	attributes {
		attribute {
			slug
		}
		values {
			slug
			name
		}
	}
}
